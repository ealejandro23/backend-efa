# =============================================================================
# Secret del Proyecto EFA - PLANTILLA DE REFERENCIA
#
# Este archivo documenta la forma del Secret. NO se incluye en el
# kustomization base y NO se aplica con 'kubectl apply': el pipeline crea el
# Secret real en tiempo de despliegue con los valores tomados de GitHub
# Secrets, de modo que las credenciales nunca quedan versionadas.
#
# El comando que lo genera es:
#
#   kubectl create secret generic efa-secrets -n efa \
#     --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
#     --from-literal=SPRING_DATASOURCE_PASSWORD="$POSTGRES_PASSWORD" \
#     --from-literal=CLOUDINARY_URL="$CLOUDINARY_URL"
#
# CLOUDINARY_URL puede ir vacio: la gestion de imagenes es opcional y la
# aplicacion arranca sin ella (ver CloudinaryConfig).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: efa-secrets
  namespace: efa
  labels:
    app.kubernetes.io/name: efa-secrets
    app.kubernetes.io/part-of: proyecto-efa
  annotations:
    efa.io/gestor-de-secretos: "Generado por el pipeline desde GitHub Secrets"
    efa.io/no-versionar: "true"
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REEMPLAZAR_POSTGRES_PASSWORD"
  SPRING_DATASOURCE_PASSWORD: "REEMPLAZAR_POSTGRES_PASSWORD"
  CLOUDINARY_URL: ""
