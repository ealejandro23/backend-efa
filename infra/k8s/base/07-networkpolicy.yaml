# =============================================================================
# NetworkPolicy - control de trafico entre pods (defensa en profundidad)
#
# La politica "default deny" bloquea todo el trafico no permitido. Solo se
# habilitan los flujos que la aplicacion necesita:
#   1. El frontend puede llamar al backend.
#   2. El backend puede llamar a la base de datos y salir a internet
#      (necesario para la API de Cloudinary).
#   3. Prometheus puede consultar las sondas de los pods.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efa-default-deny
  namespace: efa
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efa-allow-frontend-to-backend
  namespace: efa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: efa-frontend
  policyTypes: ["Ingress"]
  ingress:
    # El Ingress (controlador nginx) sirve la aplicacion al usuario.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # El propio frontend puede llamar a si mismo (SPA con enrutado).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: efa-frontend
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efa-allow-backend-from-frontend
  namespace: efa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: efa-backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: efa-frontend
      ports:
        - protocol: TCP
          port: 8080
---
# =============================================================================
# El stack de observacion puede consultar las metricas de la aplicacion
#
# Sin esta politica, la denegacion por defecto bloquea el scrapeo: las
# peticiones de Prometheus a los pods se quedarian esperando hasta el
# timeout, y el dashboard mostraria los paneles de metricas vacios sin
# ningun error visible en los logs de Prometheus.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efa-allow-monitoring-egress
  namespace: efa
spec:
  # Aplica al stack de observacion: Prometheus y Grafana.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["observabilidad"]
  policyTypes: ["Egress"]
  egress:
    # Prometheus raspea las metricas del backend.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: efa-backend
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus raspea las metricas del exporter de nginx.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: efa-frontend
      ports:
        - protocol: TCP
          port: 9113
    # Grafana consulta a Prometheus (datasource) y a Loki (logs).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    # Prometheus consulta la API del kubelet (cAdvisor) por HTTPS.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 10250
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efa-allow-prometheus-from-monitoring
  namespace: efa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["observabilidad"]
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efa-allow-backend-from-monitoring
  namespace: efa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: efa-backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efa-allow-frontend-from-monitoring
  namespace: efa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: efa-frontend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9113
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efa-allow-backend-egress
  namespace: efa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: efa-backend
  policyTypes: ["Egress"]
  egress:
    # Salida hacia la base de datos.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: efa-db
      ports:
        - protocol: TCP
          port: 5432
    # Salida a la sonda de salud del propio pod (kubelet).
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    # Salida a servicios externos (Cloudinary, DNS).
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efa-allow-db-from-backend
  namespace: efa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: efa-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: efa-backend
      ports:
        - protocol: TCP
          port: 5432
---
# Acceso a las interfaces web de observabilidad (Grafana y Prometheus).
# Con "default deny", sin esta regla los NodePort quedan inaccesibles.
# La restriccion de QUIEN puede entrar se aplica fuera del cluster: en AWS,
# el Security Group solo abre los puertos 30090/30093 a la IP del equipo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efa-allow-dashboards-ingress
  namespace: efa
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["grafana", "prometheus"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 9090
---
# Prometheus consulta el kubelet (cAdvisor: CPU/memoria de los contenedores)
# y la API de Kubernetes, que escuchan en la IP del NODO, no en un pod: un
# namespaceSelector no los cubre, por eso se usa ipBlock limitado a esos
# puertos.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efa-allow-prometheus-to-nodes
  namespace: efa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 10250
        - protocol: TCP
          port: 6443
---
# Grafana y Prometheus resuelven los servicios por nombre (por ejemplo el
# datasource http://prometheus.efa.svc.cluster.local:9090). Sin esta regla,
# "default deny" bloquea el DNS y todos los paneles de Grafana fallan.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efa-allow-monitoring-dns
  namespace: efa
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["observabilidad"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
