# =============================================================================
# Prometheus - configuracion para su ejecucion dentro del cluster
#
# Diferencias respecto a infra/monitoring/prometheus/prometheus.yml (entorno
# local con Docker Compose):
#   - El descubrimiento de pods usa kubernetes_sd_configs con las anotaciones
#     prometheus.io/scrape que traen los manifiestos del proyecto.
#   - Loki no vive en el cluster. El Pushgateway si (03-pushgateway.yaml):
#     guarda las metricas del pipeline CI/CD de forma persistente.
# =============================================================================
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: "efa-cluster"
    environment: "prod"
    project: "efa"

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # Metricas del pipeline CI/CD publicadas por
  # scripts/ci/collect-pipeline-metrics.sh. honor_labels conserva las
  # etiquetas propias de cada metrica (repository, branch, commit, stage...).
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: monitoring

  # --- Backend Spring Boot ---------------------------------------------------
  - job_name: efa-backend-k8s
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["efa"]
    relabel_configs:
      # Solo se scrapea lo que se solicito explicitamente.
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      # Y solo los pods del microservicio: sin este filtro, este job tambien
      # scraped el exporter de metricas del frontend, y las dos series
      # quedaban mezcladas en el mismo objetivo.
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: "efa-backend"
      # Ruta de metrics customizable (por defecto /actuator/prometheus).
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: "([^:]+)(?::\\d+)?;(\\d+)"
        replacement: "$1:$2"
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: replace
        target_label: app
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
        action: replace
        target_label: version
      - source_labels: [__meta_kubernetes_pod_annotation_efa_io_commit]
        action: replace
        target_label: commit

  # --- Frontend (nginx) ------------------------------------------------------
  - job_name: efa-frontend-k8s
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["efa"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      # Solo los pods del frontend (mismo motivo que en el job del backend).
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: "efa-frontend"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: "([^:]+)(?::\\d+)?;(\\d+)"
        replacement: "$1:$2"
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: replace
        target_label: app

  # --- cAdvisor del nodo -----------------------------------------------------
  # En Kubernetes, el cAdvisor va embebido en el kubelet y se expone por
  # HTTPS en el puerto 10250, bajo la ruta /metrics/cadvisor.
  - job_name: cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    # El kubelet exige autenticacion: se usa el token de la ServiceAccount
    # "prometheus" (permiso nodes/metrics en el ClusterRole efa-prometheus).
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: "__meta_kubernetes_node_label_(.+)"
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node

  # --- kube-state-metrics ----------------------------------------------------
  - job_name: kubernetes-apiservers
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: "kubernetes"
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: "https"
