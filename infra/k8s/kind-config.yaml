# =============================================================================
# Kind - configuracion del cluster Kubernetes de un solo nodo
#
# Kind crea un cluster real de Kubernetes ejecutandose dentro de contenedores
# Docker. Es el entorno "nube simulado" del proyecto: reproduce el
# comportamiento del orquestador (scheduling, probes, HPA, PDB, NetworkPolicy)
# en un laptop, sin costo de proveedor.
#
# Para un cluster de nube real (AWS EKS, GCP GKE, Azure AKS) los manifiestos
# de infra/k8s son los mismos: solo cambia el comando de contexto y la
# autenticacion.
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: efa-cluster

nodes:
  # --- Nodo de control plane (also hosts the workloads) ----------------------
  - role: control-plane
    kubeadmConfigPatches:
      # Se permite el scheduling de cargas de trabajo en el nodo de control
      # para que el cluster de un solo nodo tenga capacidad suficiente.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true,topology.kubernetes.io/zone=efa-zone-a"
    extraPortMappings:
      # Ingress (nginx) del cluster, accesible desde el host.
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      # Puerto de las sondas de Prometheus para las evidencias.
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
      - containerPort: 30093
        hostPort: 30093
        protocol: TCP

  # --- Nodo de trabajo -------------------------------------------------------
  # Un segundo nodo permite comprobar la distribucion de replicas
  # (topologySpreadConstraints) y el comportamiento del PodDisruptionBudget.
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=efa-zone-b"

# Red con salida a internet para descargar imagenes y AddOns.
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
