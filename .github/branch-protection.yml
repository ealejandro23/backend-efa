# =============================================================================
# Politica de proteccion de la rama principal
#
# Este archivo es la declaracion legible y versionada de la configuracion de
# proteccion de rama que se aplica en la configuracion del repositorio de
# GitHub. Se versiona para que:
#
#   1. Los cambios en la politica se revisen como cualquier otro cambio.
#   2. El script scripts/compliance/verify-branch-protection.sh pueda
#      verificar que la configuracion real de GitHub coincide con la
#      declarada aqui (politica P-SEC-006).
#   3. Se documente de forma explicita porque forma parte de los controles
#      de cumplimiento del proyecto.
#
# Aplicacion en GitHub:
#   Settings > Branches > Add rule > Branch name pattern: main
#   (o mediante la API, ver el comando documentado en docs/COMPLIANCE.md)
# =============================================================================

version: 1
repository: ealejandro23/backend-efa
policy_id: P-SEC-006
applies_to:
  - main

# --- Reglas obligatorias ----------------------------------------------------
rules:
  # Se exige al menos una revision aprobada antes de integrar.
  required_pull_request_reviews:
    required_approving_review_count: 1
    dismiss_stale_reviews: true
    require_code_owner_reviews: true
    require_last_push_approval: true

  # Las verificaciones que deben estar en verde para permitir el merge.
  # Son las mismas etapas que ejecuta el pipeline, de modo que un Pull
  # Request no puede integrarse con controles saltados.
  required_status_checks:
    strict: true
    checks:
      - context: "CI — Tests, Calidad y Seguridad"
      - context: "Compliance — Gate de cumplimiento"

  # Restricciones de escritura sobre la rama.
  restrictions:
    # No se permiten pushes directos: todo cambio entra por Pull Request.
    push_restrictions: []
    # No se permiten force-pushes sobre la rama principal.
    allow_force_pushes: false
    # No se permite eliminar la rama principal.
    allow_deletions: false
    # El merge se bloquea mientras haya conflictos.
    require_linear_history: true
    # No se permiten merges que mezclan ramas sin historial lineal.
    allow_merges: false

  # Ramas que pueden fusionarse sin pasar por el gate (usuarios con permiso
  # de bypass). En este proyecto no se concede a nadie: el gate siempre corre.
  bypass_pull_request_allowances:
    users: []
    teams: []
    apps: []

# --- Verificacion automatizada ----------------------------------------------
verification:
  script: scripts/compliance/verify-branch-protection.sh
  runs_on:
    - push a main
    - pull_request hacia main
  expected_check_contexts:
    - "CI — Tests, Calidad y Seguridad"
    - "Compliance — Gate de cumplimiento"

# --- Consecuencia del incumplimiento ---------------------------------------
consequence: >-
  El gate de cumplimiento falla, el Pull Request no puede integrarse y el
  workflow de despliegue no se dispara. El entorno productivo permanece sin
  cambios.
