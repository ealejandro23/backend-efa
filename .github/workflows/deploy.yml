name: Build, push y deploy backend (AWS EC2 + ECR)

# =============================================================================
# Despliegue continuo del microservicio EFA.
#
# El despliegue se gatena por workflow_run del CI, es decir, solo cuando la
# integracion continua termina en sucesso. A eso se suma una segunda
# verificacion explicita (job "gate") que consulta la API de GitHub para
# confirmar que TODAS las verificaciones obligatorias del commit estan en
# verde. Esta segunda verificacion es la que materializa el indicador IE6:
# ninguna falla critica puede llegar al entorno productivo, y si llega a
# intentarlo, el pipeline se detiene.
# =============================================================================

on:
  workflow_run:
    workflows:
      - "CI — Tests, Calidad y Seguridad"
      - "Compliance — Auditoría de cumplimiento"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "SHA del commit a desplegar (por defecto, el del ultimo CI aprobado)"
        required: false
        default: ""

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: proyecto-efa-backend
  CONTAINER_NAME: proyecto-efa-backend

jobs:

  # ===========================================================================
  # Gate de despliegue (IE6)
  #
  # Comprueba, contra la API de GitHub, que el commit que se va a desplegar
  # tiene en verde todas las verificaciones obligatorias. Si alguna no lo
  # esta, el pipeline se detiene y el entorno productivo no se toca.
  # ===========================================================================
  gate:
    name: Gate de despliegue (verificaciones obligatorias)
    runs-on: ubuntu-latest

    outputs:
      allowed: ${{ steps.verify.outputs.allowed }}
      commit_sha: ${{ steps.verify.outputs.commit_sha }}

    steps:
      - name: Verificar el resultado del CI y del gate de cumplimiento
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.inputs.commit_sha || github.event.workflow_run.head_sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail

          echo "Workflow de origen : ${CI_WORKFLOW}"
          echo "Resultado          : ${CI_CONCLUSION}"
          echo "Commit             : ${TARGET_SHA}"

          # --- 1. El workflow de origen debe haber terminado en exito --------
          if [ "${CI_CONCLUSION}" != "success" ]; then
            echo "::error::El workflow de origen termino con '${CI_CONCLUSION}'. El despliegue se bloquea."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # --- 2. El evento de origen debe ser un push a main ---------------
          if [ "${CI_EVENT}" != "push" ] && [ "${CI_WORKFLOW}" != "CI — Tests, Calidad y Seguridad" ]; then
            echo "::error::Solo se despliega desde un push verificado a la rama principal."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # --- 3. Verificaciones obligatorias en verde -----------------------
          # Se consultan los check runs del commit (el nombre de un check run
          # es el nombre del JOB, no el del workflow). Ambos son obligatorios:
          #   - "Build, Tests, Calidad y Seguridad"   (CI)
          #   - "Compliance — Gate de cumplimiento"    (cumplimiento)
          #
          # El CD se dispara al terminar cada uno de los dos workflows. Si el
          # otro todavia no termina, esta ejecucion no despliega y lo informa;
          # la ejecucion disparada por el ultimo en terminar es la que
          # despliega. Si cualquiera de los dos fallo, el despliegue se
          # bloquea y este job termina en rojo.
          REQUIRED_CHECKS="Build, Tests, Calidad y Seguridad|Compliance — Gate de cumplimiento"

          echo "Verificaciones obligatorias: ${REQUIRED_CHECKS//|/, }"
          echo ""

          CHECK_RUNS="$(curl --silent --show-error --fail \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100")"

          FAILED=false
          PENDING=false
          IFS='|' read -ra CHECKS <<< "${REQUIRED_CHECKS}"
          for CHECK in "${CHECKS[@]}"; do
            # Check run mas reciente con ese nombre (status y conclusion).
            RESULT="$(jq -r --arg name "${CHECK}" '
              [.check_runs[] | select(.name == $name)]
              | sort_by(.started_at) | last
              | if . == null then "missing"
                elif .status != "completed" then "pending"
                else (.conclusion // "unknown") end' <<< "${CHECK_RUNS}")"

            case "${RESULT}" in
              success)
                echo "  [OK]        ${CHECK}: success" ;;
              missing|pending)
                echo "  [PENDIENTE] ${CHECK}: ${RESULT}"
                PENDING=true ;;
              *)
                echo "  [FALLA]     ${CHECK}: ${RESULT}"
                FAILED=true ;;
            esac
          done

          echo ""
          if [ "${FAILED}" = "true" ]; then
            echo "::error::Una verificacion obligatoria fallo. El entorno productivo queda protegido y NO se despliega."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "${PENDING}" = "true" ]; then
            echo "::notice::Hay verificaciones obligatorias en curso. Esta ejecucion no despliega; lo hara la que se dispare al terminar la ultima verificacion."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "::notice::Gate de despliegue aprobado. Se despliega el commit ${TARGET_SHA}."

  # ===========================================================================
  # Build de la imagen a partir del commit verificado
  # ===========================================================================
  build:
    name: Build de la imagen Docker
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout del commit aprobado
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.commit_sha }}
          persist-credentials: false

      - name: Definir tag de imagen
        id: meta
        env:
          COMMIT_SHA: ${{ needs.gate.outputs.commit_sha }}
        run: echo "tag=${COMMIT_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Build de la imagen Docker
        run: |
          docker build \
            --build-arg APP_VERSION="${GITHUB_SHA}" \
            -t ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }} .

      - name: Guardar imagen como artifact
        run: |
          docker save \
            ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }} \
            -o image.tar

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ===========================================================================
  # Publicacion en Amazon ECR
  # ===========================================================================
  push:
    name: Push a ECR
    needs: [gate, build]
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Cargar imagen Docker
        run: docker load -i image.tar

      - name: Configurar credenciales AWS
        if: ${{ vars.DEMO_MODE != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        if: ${{ vars.DEMO_MODE != 'true' }}
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag y push de la imagen
        if: ${{ vars.DEMO_MODE != 'true' }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          docker tag \
            "${ECR_REPOSITORY}:${IMAGE_TAG}" \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag \
            "${ECR_REPOSITORY}:${IMAGE_TAG}" \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Simular push (demo mode)
        if: ${{ vars.DEMO_MODE == 'true' }}
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          echo "DEMO_MODE activo: se omite push real a ECR"
          echo "Imagen simulada: $ECR_REPOSITORY:$IMAGE_TAG"

  # ===========================================================================
  # Despliegue
  # ===========================================================================
  deploy:
    name: Deploy en EC2
    needs: [gate, build, push]
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Configurar credenciales AWS
        if: ${{ vars.DEMO_MODE != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        if: ${{ vars.DEMO_MODE != 'true' }}
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Checkout del commit aprobado
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.commit_sha }}
          persist-credentials: false

      - name: Generar entorno para Docker Compose
        if: ${{ vars.DEMO_MODE != 'true' }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          {
            echo "ECR_REGISTRY=$ECR_REGISTRY"
            echo "ECR_REPOSITORY=$ECR_REPOSITORY"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "POSTGRES_DB=$POSTGRES_DB"
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "CLOUDINARY_URL=$CLOUDINARY_URL"
            echo "APP_VERSION=${IMAGE_TAG}"
            echo "GIT_COMMIT=${GITHUB_SHA}"
            echo "GIT_BRANCH=${GITHUB_REF_NAME}"
          } > .env

          chmod 600 .env

      - name: Pull de la nueva imagen
        if: ${{ vars.DEMO_MODE != 'true' }}
        run: docker compose --env-file .env pull backend

      - name: Levantar backend y base de datos
        if: ${{ vars.DEMO_MODE != 'true' }}
        run: docker compose --env-file .env up -d

      - name: Limpiar imagenes viejas
        if: ${{ vars.DEMO_MODE != 'true' }}
        run: docker image prune -af --filter "until=48h"

      - name: Descargar imagen Docker para entorno simulado
        if: ${{ vars.DEMO_MODE == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Desplegar con Docker Compose en entorno simulado
        id: deploy
        if: ${{ vars.DEMO_MODE == 'true' }}
        env:
          IMAGE_TAG_ORIGINAL: ${{ needs.build.outputs.image-tag }}
          DEPLOY_START: ${{ github.run_started_at }}
        run: |
          set -euo pipefail

          docker load -i image.tar
          docker tag "${ECR_REPOSITORY}:${IMAGE_TAG_ORIGINAL}" efa-local/backend:latest

          export ECR_REGISTRY=efa-local
          export ECR_REPOSITORY=backend
          export IMAGE_TAG=latest
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export POSTGRES_PASSWORD
          export POSTGRES_PORT=5433
          export BACKEND_PORT=8083
          export APP_VERSION="${IMAGE_TAG_ORIGINAL}"
          export GIT_COMMIT="${GITHUB_SHA}"
          export GIT_BRANCH="main"
          export SPRING_PROFILES_ACTIVE=prod

          docker compose -p efa-ci-demo config --quiet
          docker compose -p efa-ci-demo pull db
          docker compose -p efa-ci-demo up -d --no-build --pull never --wait --wait-timeout 180

          docker compose -p efa-ci-demo ps

          curl --fail --silent --show-error \
            http://localhost:8083/actuator/health \
            -o health.json

          cat health.json
          grep -q '"status":"UP"' health.json

          # Se verifica tambien que el microservicio expone sus metricas:
          # sin ellas no habria observabilidad del despliegue.
          curl --fail --silent --show-error \
            http://localhost:8083/actuator/prometheus \
            -o metrics.txt

          grep -q '^efa_availability_up' metrics.txt

          echo "Despliegue Compose validado correctamente"

      - name: Mostrar estado de Compose
        if: ${{ always() && vars.DEMO_MODE == 'true' }}
        run: docker compose -p efa-ci-demo ps

      # =====================================================================
      # Publicacion de las metricas del despliegue (IE3)
      # =====================================================================
      - name: Publicar las metricas del despliegue
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          chmod +x scripts/ci/*.sh
          DURATION=$(( $(date +%s) - $(date -d "${DEPLOY_START}" +%s) ))
          bash scripts/ci/publish-deploy-metrics.sh \
            "${DURATION}" \
            "$([ "${DEPLOY_OUTCOME}" = "success" ] && echo success || echo failed)" \
            "branch=main" || true
