# =============================================================================
# Compliance - Gate de cumplimiento del Proyecto EFA
#
# Este workflow es el materializador del indicador IE6: implementa los
# mecanismos de validacion que interrumpen automaticamente el pipeline ante
# fallas criticas de seguridad o calidad, protegiendo el entorno productivo.
#
# El job "compliance-gate" es una verificacion obligatoria de la rama
# principal (ver .github/branch-protection.yml). Si el gate falla, GitHub
# impide el merge y, en consecuencia, el workflow de despliegue nunca se
# dispara.
#
# El gate no depende de servicios externos ni de infraestructura: las
# auditorias de secretos, Dockerfiles, manifiestos de Kubernetes, flujos,
# documentacion y configuracion son puramente estaticas. Las auditorias
# que requieren infraestructura (alertas en Prometheus, proteccion de rama,
# cobertura) informan cuando la herramienta no esta disponible, en lugar de
# fallar por un problema de entorno del runner.
# =============================================================================

name: Compliance — Auditoría de cumplimiento

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

# Evita que dos ejecuciones del gate compitan por los mismos puertos del
# runner: el resultado de una auditoria se mezclaria con el de otra.
concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: true

env:
  REPOSITORY: ${{ github.repository }}

jobs:
  compliance-gate:
    name: Compliance — Gate de cumplimiento
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar el entorno de auditoria
        run: |
          chmod +x scripts/compliance/*.sh scripts/ci/*.sh
          mkdir -p evidencias/compliance

      # Genera el reporte de cobertura que consulta la politica P-QA-002.
      - name: Ejecutar pruebas y generar la cobertura (P-QA-002)
        working-directory: demo
        run: mvn -B -ntp clean verify

      # --- Informativas -------------------------------------------------------
      - name: Auditoría de secretos versionados (P-SEC-001)
        run: bash scripts/compliance/audit-secrets.sh .

      - name: Auditoría de Dockerfiles (P-SEC-002 / P-SEC-005)
        run: bash scripts/compliance/audit-dockerfile.sh

      - name: Auditoría de manifiestos Kubernetes (P-SEC-004)
        run: bash scripts/compliance/audit-kubernetes.sh infra/k8s

      - name: Auditoría de la integracion de observabilidad (P-OBS-001 / P-OBS-002)
        run: bash scripts/compliance/audit-observability.sh

      - name: Auditoría de la integridad del pipeline (P-QA-004 / P-CI-001)
        run: bash scripts/compliance/audit-workflows.sh .github/workflows

      - name: Auditoría de la documentacion (P-DOC-001 / P-DOC-002)
        run: bash scripts/compliance/audit-docs.sh

      # --- Informativas con tolerancia ---------------------------------------
      # La proteccion de rama requiere permisos de administracion del
      # repositorio; si el token no los tiene, la auditoria se omite y se
      # informa explicitamente en el resumen.
      - name: Verificacion de la proteccion de rama (P-SEC-006)
        continue-on-error: true
        run: bash scripts/compliance/verify-branch-protection.sh "${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECKS: "Build, Tests, Calidad y Seguridad,Compliance — Gate de cumplimiento"

      # --- Gate principal -----------------------------------------------------
      # Ejecuta todas las politicas y consolida el resultado. Cualquier
      # politica bloqueante incumplida hace fallar ESTE job, lo que impide
      # el merge y detiene el pipeline antes del despliegue.
      - name: Gate de cumplimiento (todas las politicas)
        id: compliance_gate
        run: |
          set +e
          bash scripts/compliance/run-all.sh --continuar 2>&1 | tee evidencias/compliance/gate-cumplimiento.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [ "${EXIT_CODE}" -ne 0 ]; then
            echo "::error::El gate de cumplimiento fue rechazado. El despliegue no se realizara."
            exit 1
          fi

          echo "::notice::El gate de cumplimiento fue aprobado."

      - name: Guardar el informe de cumplimiento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-cumplimiento-${{ github.run_number }}
          path: evidencias/compliance/
          retention-days: 30
          if-no-files-found: ignore

  # ===========================================================================
  # Gate de despliegue en Kubernetes (IE2 + IE6)
  #
  # Despliega el microservicio en un cluster Kubernetes real (kind) e instala
  # el stack de observabilidad. Es la continuacion natural del gate: solo se
  # ejecuta si todas las verificaciones anteriores estan en verde.
  # ===========================================================================
  deploy-kubernetes:
    name: Deploy en Kubernetes (kind) con observabilidad
    needs: compliance-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar kind y kubectl
        run: |
          # El runner ya trae kind y kubectl en /usr/local/bin como root:
          # se descargan las versiones fijadas a un directorio temporal y se
          # instalan con sudo para no depender de la version preinstalada.
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64 -o "${RUNNER_TEMP}/kind"
          curl -fsSL "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl" -o "${RUNNER_TEMP}/kubectl"
          sudo install -m 0755 "${RUNNER_TEMP}/kind" /usr/local/bin/kind
          sudo install -m 0755 "${RUNNER_TEMP}/kubectl" /usr/local/bin/kubectl
          kind version
          kubectl version --client=true

      - name: Obtener el repositorio del frontend
        run: |
          git clone --depth 1 https://github.com/FeOrtegah/Frontend-.git "${RUNNER_TEMP}/Frontend"
          ls "${RUNNER_TEMP}/Frontend"

      - name: Construir las imagenes Docker
        run: |
          docker build -t efa-backend:latest .
          docker build -t efa-frontend:latest "${RUNNER_TEMP}/Frontend"

      - name: Desplegar en el cluster y verificar la observabilidad
        env:
          FRONTEND_DIR: ${{ runner.temp }}/Frontend
          IMAGE_TAG: latest
          ENVIRONMENT: prod
          # Trazabilidad: el commit y la rama quedan en las etiquetas de los
          # pods y en /actuator/info (dashboard "Version desplegada").
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p evidencias
          chmod +x scripts/k8s/*.sh
          bash scripts/k8s/deploy-kind.sh 2>&1 | tee evidencias/deploy-kubernetes.txt

      - name: Guardar el informe del despliegue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-despliegue-k8s-${{ github.run_number }}
          path: evidencias/
          retention-days: 30
          if-no-files-found: ignore
