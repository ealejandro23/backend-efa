
name: CI — Tests, Calidad y Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-analyze:
    name: Build, Tests, Calidad y Seguridad
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar código
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Java
      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/pom.xml

      # 3. Configurar Node para Snyk
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. Ejecutar pruebas y generar JaCoCo
      - name: Ejecutar pruebas JUnit y JaCoCo
        working-directory: demo
        run: mvn -B -ntp clean verify

      # 5. Publicar reporte JaCoCo
      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: demo/target/site/jacoco/
          if-no-files-found: error

      # 6. Análisis SonarCloud
      - name: Análisis SonarCloud
        working-directory: demo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'ealejandro23_backend-efa' }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'ealejandro23' }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      # 7. Instalar Snyk CLI
      - name: Instalar Snyk CLI
        run: npm install -g snyk

      # 8. Escanear dependencias Maven
      - name: Escaneo Snyk de dependencias
        working-directory: demo
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=pom.xml \
            --package-manager=maven \
            --severity-threshold=high

      # 9. Construir imagen Docker
      - name: Build de imagen Docker
        run: |
          docker build -t proyecto-efa-backend:latest .

      # 10. Escanear imagen Docker
      - name: Escaneo Snyk de imagen Docker
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test proyecto-efa-backend:latest \
            --file=Dockerfile \
            --severity-threshold=high

      # 11. Verificar imagen generada
      - name: Verificar imagen Docker
        run: docker image inspect proyecto-efa-backend:latest

      # 12. Resumen
      - name: Resumen del pipeline
        if: success()
        run: |
          echo "Pipeline CI completado correctamente"
          echo "Pruebas JUnit y JaCoCo: OK"
          echo "SonarCloud: OK"
          echo "Snyk dependencias: OK"
          echo "Snyk contenedor: OK"
          echo "Docker Build: OK"
