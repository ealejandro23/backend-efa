name: CI — Tests, Calidad y Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# El CI no se cancela a si mismo: una cancelacion dejaria el gate de
# cumplimiento sin informacion sobre el commit evaluado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: ${{ github.sha }}
  GIT_COMMIT: ${{ github.sha }}
  GIT_BRANCH: ${{ github.ref_name }}
  BUILD_TIME: ${{ github.run_started_at }}
  ENVIRONMENT: ci
  PUSHGATEWAY_URL: http://localhost:9091
  REPOSITORY: ${{ github.repository }}

jobs:
  build-test-analyze:
    name: Build, Tests, Calidad y Seguridad
    runs-on: ubuntu-latest

    services:
      # El Pushgateway recibe las metricas del pipeline (cobertura, estado del
      # build, duracion de las etapas) que alimentan el tablero de Grafana
      # "EFA - Pipeline CI/CD, Cobertura y Despliegue".
      pushgateway:
        image: prom/pushgateway:v1.11.5
        ports:
          - 9091:9091
        options: >-
          --health-cmd "wget --quiet --spider http://localhost:9091/-/healthy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/pom.xml

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # =====================================================================
      # Etapa 1: Pruebas automatizadas y cobertura
      # =====================================================================
      - name: Ejecutar pruebas JUnit y JaCoCo
        id: tests
        working-directory: demo
        run: |
          mvn -B -ntp clean verify
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: demo/target/site/jacoco/
          if-no-files-found: error

      # --- Gate de cobertura (P-QA-002) -------------------------------------
      # Si la cobertura baja del umbral, este paso falla y el pipeline se
      # detiene antes de construir la imagen.
      - name: Gate de cobertura de pruebas (P-QA-002)
        id: coverage
        run: |
          chmod +x scripts/ci/*.sh scripts/compliance/*.sh
          bash scripts/compliance/audit-coverage.sh demo/target/site/jacoco/jacoco.xml "${COVERAGE_MIN:-0.60}"
          bash scripts/ci/publish-coverage.sh demo/target/site/jacoco/jacoco.xml "${COVERAGE_MIN:-0.60}"
        env:
          COVERAGE_MIN: 0.60

      # =====================================================================
      # Etapa 2: Calidad estatica (SonarCloud)
      # =====================================================================
      - name: Analisis SonarCloud
        id: sonar
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        working-directory: demo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'ealejandro23_backend-efa' }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'ealejandro23' }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      - name: Publicar el resultado del Quality Gate
        if: always()
        run: |
          chmod +x scripts/ci/*.sh
          bash scripts/ci/publish-metrics.sh efa_ci_quality_gate_passed \
            "${{ steps.sonar.outcome == 'success' && '1' || '0' }}" \
            "branch=${GITHUB_REF_NAME}" \
            "commit=${GITHUB_SHA}" || true

      # =====================================================================
      # Etapa 3: Seguridad de dependencias e imagen
      # =====================================================================
      - name: Instalar Snyk CLI
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: npm install -g snyk

      - name: Escaneo Snyk de dependencias
        id: snyk_deps
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        working-directory: demo
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          # El detalle se muestra en el log (evidencia legible) y ademas se
          # guarda en JSON como artefacto del pipeline.
          snyk test \
            --file=pom.xml \
            --package-manager=maven \
            --severity-threshold=high \
            --json-file-output=snyk-dependencies.json || SNYK_EXIT=$?
          if [ "${SNYK_EXIT:-0}" -ne 0 ]; then
            echo "::error::Snyk detecto vulnerabilidades de severidad alta o critica en las dependencias"
            exit 1
          fi

      - name: Ejecutar pruebas dentro del contenedor
        run: docker build --target tester -t proyecto-efa-backend:tester .

      - name: Construir la imagen Docker
        id: build
        run: docker build -t proyecto-efa-backend:latest .

      - name: Escaneo Snyk de imagen Docker
        id: snyk_image
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test proyecto-efa-backend:latest \
            --file=Dockerfile \
            --severity-threshold=high \
            --policy-path=.snyk \
            --json-file-output=snyk-image.json || SNYK_EXIT=$?
          if [ "${SNYK_EXIT:-0}" -ne 0 ]; then
            echo "::error::Snyk detecto vulnerabilidades de severidad alta o critica en la imagen"
            exit 1
          fi

      - name: Guardar los informes de Snyk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-snyk-${{ github.run_number }}
          path: |
            demo/snyk-dependencies.json
            snyk-image.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Publicar el resumen de seguridad
        if: always()
        run: |
          chmod +x scripts/ci/*.sh
          bash scripts/ci/publish-metrics.sh efa_ci_build_success \
            "${{ steps.tests.outcome == 'success' && '1' || '0' }}" \
            "branch=${GITHUB_REF_NAME}" \
            "commit=${GITHUB_SHA}" || true
          bash scripts/ci/publish-metrics.sh efa_ci_security_vulnerabilities \
            "${{ steps.snyk_deps.outcome == 'success' && '0' || '1' }}" \
            "branch=${GITHUB_REF_NAME}" \
            "severity=high" || true

      - name: Verificar imagen Docker
        run: docker image inspect proyecto-efa-backend:latest

      # =====================================================================
      # Etapa 4: Resumen del pipeline
      # =====================================================================
      - name: Resumen del pipeline
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "Pruebas JUnit y JaCoCo: ${{ steps.tests.outcome }}"
          echo "Docker Build: ${{ steps.build.outcome }}"
          echo "SonarCloud: ${{ steps.sonar.outcome }}"
          echo "Snyk dependencias: ${{ steps.snyk_deps.outcome }}"
          echo "Snyk contenedor: ${{ steps.snyk_image.outcome }}"
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "PR Dependabot: SonarCloud y Snyk omitidos por restricciones de secretos"
            echo "Los controles completos se ejecutaran en main"
          fi
