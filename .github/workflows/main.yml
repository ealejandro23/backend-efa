name: CI — Tests, Calidad y Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-analyze:
    name: Build, Tests, Calidad y Seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/pom.xml

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ejecutar pruebas JUnit y JaCoCo
        working-directory: demo
        run: mvn -B -ntp clean verify

      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: demo/target/site/jacoco/
          if-no-files-found: error

      - name: Analisis SonarCloud
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        working-directory: demo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'ealejandro23_backend-efa' }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'ealejandro23' }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      - name: Instalar Snyk CLI
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: npm install -g snyk

      - name: Escaneo Snyk de dependencias
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        working-directory: demo
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=pom.xml \
            --package-manager=maven \
            --severity-threshold=high

      - name: Build de imagen Docker
        run: docker build -t proyecto-efa-backend:latest .

      - name: Escaneo Snyk de imagen Docker
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test proyecto-efa-backend:latest \
            --file=Dockerfile \
            --severity-threshold=high

      - name: Verificar imagen Docker
        run: docker image inspect proyecto-efa-backend:latest

      - name: Resumen del pipeline
        if: success()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "Pruebas JUnit y JaCoCo: OK"
          echo "Docker Build: OK"
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "PR Dependabot: SonarCloud y Snyk omitidos por restricciones de secretos"
            echo "Los controles completos se ejecutaran en main"
          else
            echo "SonarCloud: OK"
            echo "Snyk dependencias: OK"
            echo "Snyk contenedor: OK"
          fi