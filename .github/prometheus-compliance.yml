# =============================================================================
# Prometheus - configuracion del gate de cumplimiento
#
# Instancia de Prometheus que se ejecuta como contenedor de servicio del
# runner durante el workflow de cumplimiento. Su unica funcion es exponer la
# serie ALERTS, que consume la auditoria P-OBS-003/004/005 para decidir si
# hay alertas criticas activas que bloqueen el despliegue.
#
# No se scrapea ningun objetivo externo: el runner no tiene acceso al
# cluster de destino y no es necesario para la decision del gate.
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "efa"
    purpose: "compliance-gate"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: monitoring
