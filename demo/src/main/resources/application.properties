# =============================================================================
# Configuracion general del servidor
# =============================================================================
server.address=0.0.0.0
server.port=${PORT:8080}
server.shutdown=graceful

# =============================================================================
# CONFIGURACION DE OBSERVABILIDAD (IE1 / IE3)
#
# Spring Boot Actuator + Micrometer exponen las metricas que Prometheus
# recolecta y que Grafana visualiza. Esta seccion define:
#   1. Que endpoints de gestion quedan accesibles (y cuales no).
#   2. El prefijo y las etiquetas comunes de las metricas, para que todos los
#      dashboards y todas las alertas usen los mismos nombres de serie.
#   3. Los histogramas que permiten calcular percentiles de latencia.
# =============================================================================

# --- Endpoints de gestion expuestos ------------------------------------------
# Lista blanca: solo endpoints de solo lectura. Los endpoints que permiten
# mutar el estado del proceso (loggers, shutdown, refresh) NO se exponen,
# de modo que un atacante que alcance el puerto de negocio no pueda, por
# ejemplo, cambiar el nivel de log para ocultar su actividad.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches,scheduledtasks,startup
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# --- Puerto de administracion ------------------------------------------------
# En el perfil "prod" (ver application-prod.properties) el actuator se mueve a
# un puerto separado para que los endpoints de gestion no queden expuestos en
# el puerto de negocio. En los demás perfiles comparte puerto, de modo que los
# healthchecks existentes (/actuator/health) siguen funcionando igual.
# management.server.port=${MANAGEMENT_PORT:8081}
# management.server.address=0.0.0.0

# --- Endpoints sensibles restringidos ---------------------------------------
# Se complementan con la lista blanca anterior: incluso si alguien los anade
# por error, quedan en modo solo lectura.
management.endpoint.env.access=read-only
management.endpoint.configprops.access=read-only
management.endpoint.loggers.access=read-only
management.endpoint.caches.access=read-only
management.endpoint.scheduledtasks.access=read-only
management.endpoint.startup.access=read-only

# --- Etiquetas comunes de todas las metricas --------------------------------
# service.name  : identificador del microservicio (usado por Prometheus,
#                 Grafana, Loki y las alertas).
# service.instance: identificador unico de la instancia (hostname/pod).
# environment  : dev | staging | prod. Evita mezclar series entre entornos.
# version      : version de la aplicacion, permite comparar releases.
# service.version / application : nombres conventional para OpenTelemetry.
management.metrics.tags.service.name=${SERVICE_NAME:efa-backend}
management.metrics.tags.service.instance=${HOSTNAME:local}
management.metrics.tags.service.version=${APP_VERSION:dev}
management.metrics.tags.environment=${ENVIRONMENT:dev}
management.metrics.tags.application=${SERVICE_NAME:efa-backend}
management.metrics.tags.team=${TEAM:devops-efa}
management.metrics.tags.commit=${GIT_COMMIT:unknown}

# --- Distribucion de percentiles --------------------------------------------
# Percentiles utiles para el panel de latencia y para la regla EfaLatenciaP95Alta.
# El histograma de percentiles se habilita de forma global y los limites de
# bucket se definen con los "SLO" (objetivos de latencia) del servicio.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s
management.metrics.distribution.minimum-expected-length.http.server.requests=3

# --- Publicacion de metricas ------------------------------------------------
management.prometheus.metrics.export.enabled=true
management.prometheus.metrics.export.enabled-for-all=true
management.metrics.export.prometheus.enabled=true

# --- Info / build -----------------------------------------------------------
# Los metadatos de build viajan por variable de entorno en el pipeline y
# permiten saber que commit esta en produccion desde el propio endpoint.
info.app.name=${INFO_APP_NAME:Proyecto EFA API}
info.app.version=${APP_VERSION:dev}
info.app.commit=${GIT_COMMIT:unknown}
info.app.branch=${GIT_BRANCH:unknown}
info.app.buildTime=${BUILD_TIME:unknown}
info.app.environment=${ENVIRONMENT:dev}

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:efa;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- Configuracion JPA ------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# --- Pool de conexiones -----------------------------------------------------
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
# El valor -1 hace que el pool NO falle de inmediato si la base de datos
# todavia no esta disponible, en lugar de abortar el arranque. Es necesario
# en Kubernetes, donde el pod de la aplicacion puede iniciar antes que el
# pod de PostgreSQL: sin esta opcion, la aplicacion cae en un ciclo de
# reinicios hasta que la base de datos levanta.
spring.datasource.hikari.initialization-fail-timeout=-1

# --- H2 Console (desactivada en produccion) ---------------------------------
spring.h2.console.enabled=false

# =============================================================================
# LOGGING (observabilidad de logs -> Loki)
#
# El perfil por defecto escribe texto plano, que es mas legible durante el
# desarrollo y en los runners de CI. El perfil "prod" (ver
# application-prod.properties) cambia a JSON nativo de Spring Boot en formato
# ECS: Loki indexa los campos (nivel, servicio, version y el MDC con el
# identificador de correlacion) en lugar de hacer busqueda sobre texto plano.
# =============================================================================
logging.level.root=INFO
logging.level.Proyecto_EFA=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [trace=%X{traceId:-}] - %msg%n

# =============================================================================
# JSON Serialization
# =============================================================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# =============================================================================
# CORS
# =============================================================================
# La configuracion CORS vive en CorsConfig.java para mantener una sola fuente
# de verdad. Aqui solo se documenta que los preflight quedan registrados en
# logs cuando se activa el nivel DEBUG del filtro.
# =============================================================================

# =============================================================================
# Swagger / OpenAPI
# =============================================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# =============================================================================
# Cloudinary (opcional para carga de imagenes)
# =============================================================================
cloudinary.url=${CLOUDINARY_URL:}

# =============================================================================
# Security
# =============================================================================
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:password}
