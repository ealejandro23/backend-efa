# =============================================================================
# Perfil de produccion - Proyecto EFA
#
# Se activa con SPRING_PROFILES_ACTIVE=prod, que es lo que hace el pipeline
# de despliegue en Kubernetes y en el workflow de CD.
#
# Diferencias principales respecto al perfil por defecto:
#   1. Los logs se emiten en JSON (formato ECS) para que Loki los indexe por
#      campos en lugar de por texto plano.
#   2. Se desactiva la documentacion interactiva de Swagger.
#   3. Se desactivan los mensajes de SQL de Hibernate.
#   4. Se usa el cierre ordenado (graceful shutdown) para que el balanceador
#      de carga de Kubernetes retire el pod sin cortar peticiones en curso.
# =============================================================================

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Actuator en el puerto de negocio ----------------------------------------
# Decision documentada en docs/DECISION-RECORDS.md (ADR-002): el actuator se
# mantiene en el mismo puerto que el servicio para que los healthchecks de
# Docker Compose, de Kubernetes y del workflow de CD usen un unico endpoint.
# La exposicion se controla por lista blanca (solo endpoints de lectura), en
# lugar de por segregacion de puertos.
#
#management.server.port=${MANAGEMENT_PORT:8081}
#management.server.address=0.0.0.0

# --- Logs estructurados -----------------------------------------------------
# En produccion el formato JSON es obligatorio: Loki indexa los campos del
# documento en lugar de hacer busqueda de texto sobre lineas completas.
# El encoder nativo de Spring Boot (formato ECS) ya incluye el MDC, de modo
# que el identificador de correlacion queda disponible como campo consultable.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${SERVICE_NAME:efa-backend}
logging.structured.ecs.service.version=${APP_VERSION:dev}
logging.structured.ecs.service.environment=${ENVIRONMENT:dev}
logging.structured.ecs.service.node-name=${HOSTNAME:local}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [trace=%X{traceId:-}] - %msg%n

# --- Swagger fuera de produccion --------------------------------------------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Trazabilidad de la solicitud -------------------------------------------
# El filtro de correlacion agrega X-Correlation-Id a la respuesta y al MDC.
# El frontend lo propaga para poder correlacionar el error que reporta el
# usuario con la linea exacta del log del backend.
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.forward-headers-strategy=framework
